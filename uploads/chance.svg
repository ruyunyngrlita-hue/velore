    <clipPath id="b2clip"><path d="M170 280 h260 a14 14 0 0 1 14 14 v200 a26 26 0 0 1 -26 26 h-236 a26 26 0 0 1 -26 -26 v-200 a14 14 0 0 1 14 -14 z"/></clipPath>
