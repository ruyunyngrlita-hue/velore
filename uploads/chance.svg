  <path d="M184 316 h232 a6 6 0 0 1 6 6 v168 a16 16 0 0 1 -16 16 h-212 a16 16 0 0 1 -16 -16 v-168 a6 6 0 0 1 6 -6 z" fill="url(#b2liq)"/>
