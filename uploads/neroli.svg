    <clipPath id="b8clip"><path d="M250 250 h100 q8 0 8 12 v26 q80 30 80 120 v90 q0 36 -36 36 h-204 q-36 0 -36 -36 v-90 q0 -90 80 -120 v-26 q0 -12 8 -12 z"/></clipPath>
